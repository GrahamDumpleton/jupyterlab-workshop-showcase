apiVersion: jupyterlab-workshop/v1alpha1
name: why-a-workshop
title: Why a workshop?
version: 0.1.0
description: Do one small task from a notebook of instructions, then do it again as a workshop, and see what the panel can do that the notebook cannot.
finish: |
  That is the case for workshops. **Guided, not just documented** goes
  further into checks, gating and checkpoints, and **Write your own**
  shows how little it takes to make one.
authors: [Graham Dumpleton]
homepage: https://github.com/GrahamDumpleton/jupyterlab-workshop-showcase
issues: https://github.com/GrahamDumpleton/jupyterlab-workshop-showcase/issues
tags: [showcase, introduction]
duration: 10m
platforms: [linux, macos, windows]
capabilities:
  - terminal
  - write-files: [workspace]
layout: notebook
gating: soft
layouts:
  workbench:
    left: collapsed
    right: { widget: instructions, size: 0.3 }
    main:
      - { area: top, widgets: ["file:project/hello.txt"] }
      - { area: bottom, widgets: ["terminal:demo"], size: 0.4 }
variables:
  - name: learner
    type: text
    default: friend
    description: What the workshop calls you
pages:
  - pages/01-the-notebook-way.md
  - pages/02-the-workshop-way.md
  - pages/03-it-knows-where-you-are.md
  - pages/04-the-window-follows-the-lesson.md
  - pages/05-how-it-is-made.md
