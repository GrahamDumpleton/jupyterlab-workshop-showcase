apiVersion: jupyterlab-workshop/v1alpha1
name: guided-not-documented
title: Guided, not just documented
version: 0.1.0
description: Instructions that check your work. Do three small tasks by hand and watch the workshop notice, hold the next page until each is done, and put things back when they go wrong.
finish: |
  Checks, gating, variables and checkpoints are the difference between
  a document and a guide. **Write your own** shows how little it takes
  to put them in a workshop of yours.
authors: [Graham Dumpleton]
tags: [showcase, checks, gating]
duration: 15m
platforms: [linux, macos, windows]
capabilities:
  - terminal
  - write-files: [workspace]
  - kernel-exec
  - auto-run
layout: default
gating: strict
variables:
  - name: project_name
    type: text
    default: my-project
    description: The name of your project, used to name a note
pages:
  - pages/01-a-check.md
  - pages/02-your-own-words.md
  - pages/03-a-check-that-runs-code.md
  - pages/04-put-it-back.md
